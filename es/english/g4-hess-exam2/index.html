<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>國小四年級英文第二次段考闖關｜何嘉仁</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --main:#a83265; --main-2:#d9578e; --accent:#f2a541; --accent-2:#e07a2f;
  --bg:#f6f4ef; --card:#ffffff; --ink:#23303f; --muted:#6b7686; --line:#e3e0d8;
  --ok:#2e9e6b; --ok-bg:#e3f5ec; --bad:#d9534f; --bad-bg:#fbe7e6; --hi:#fff4d6;
  --shadow:0 4px 18px rgba(30,45,70,.08);
}
*{box-sizing:border-box}
html{font-size:18px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;line-height:1.7}
button{font-family:inherit;font-size:1rem;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
header.hero{background:linear-gradient(135deg,#8c2352 0%,#d9578e 60%,#ffc2d9 140%);color:#fff;padding:40px 0 32px}
.hero h1{margin:0 0 6px;font-size:1.9rem;font-weight:900;letter-spacing:.04em}
.hero p{margin:0;opacity:.92}
.hero .tag{display:inline-block;background:rgba(255,255,255,.18);padding:2px 12px;border-radius:99px;font-size:1rem;margin-bottom:10px}
nav.tabs{position:sticky;top:0;z-index:20;background:rgba(246,244,239,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:6px;overflow-x:auto;padding-top:10px;padding-bottom:10px}
.tab{border:none;background:#fff;color:var(--ink);padding:8px 16px;border-radius:99px;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.06);font-weight:500}
.tab.on{background:var(--main);color:#fff}
.subtabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 16px}
.sub{border:2px solid var(--line);background:#fff;padding:7px 14px;border-radius:12px;font-weight:500;color:var(--ink)}
.sub.on{border-color:var(--accent);background:var(--hi)}
main{padding:10px 0 60px}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:22px;margin:0 0 20px}
h2{font-size:1.45rem;margin:26px 0 4px;color:var(--main)}
h3{font-size:1.15rem;margin:0 0 10px;color:var(--main)}
.muted{color:var(--muted);font-size:1rem}
.pill{display:inline-block;font-size:1rem;padding:1px 10px;border-radius:99px;background:var(--hi);color:#8a5a00;margin-right:6px;font-weight:700}
.btn{border:none;background:var(--main);color:#fff;padding:9px 20px;border-radius:12px;font-weight:700}
.btn.alt{background:var(--accent);color:#3b2600}
.btn.ghost{background:#eef1f6;color:var(--main)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}.hero h1{font-size:1.5rem}}

/* ---------- 考點雷達 ---------- */
.bars .b{display:grid;grid-template-columns:150px 1fr 44px;gap:10px;align-items:center;margin:7px 0}
.bars .track{background:#eef1f6;border-radius:99px;height:14px;overflow:hidden}
.bars .fill{height:100%;background:linear-gradient(90deg,var(--main-2),var(--accent));border-radius:99px;width:0;transition:width 1s ease}
@media(max-width:560px){.bars .b{grid-template-columns:100px 1fr 36px;font-size:1rem}}
.chips span{display:inline-block;background:#eef1f6;border-radius:10px;padding:3px 10px;margin:4px 4px 0 0;font-size:1rem}
.chips span b{color:var(--accent-2)}
.lessoncards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
@media(max-width:860px){.lessoncards{grid-template-columns:1fr 1fr}}
.lc{border-radius:16px;padding:18px;color:#fff;cursor:pointer;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow);transition:transform .2s}
.lc:hover{transform:translateY(-3px)}
.lc .n{font-size:1rem;opacity:.9}.lc .t{font-size:1.3rem;font-weight:900}.lc .d{font-size:1rem;opacity:.92}

/* ---------- 動畫 ---------- */
.stage{border-radius:16px;overflow:hidden;background:#0d1b33;position:relative}
.stage svg{display:block;width:100%;height:auto}
.caption{margin-top:14px}
.caption .poem{background:#f3f6fb;border-left:5px solid var(--main-2);padding:10px 14px;border-radius:8px;font-size:1.05rem}
.caption .key{background:var(--hi);border-left:5px solid var(--accent);padding:10px 14px;border-radius:8px;margin-top:10px}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.steps button{border:2px solid var(--line);background:#fff;border-radius:10px;padding:5px 12px}
.steps button.on{border-color:var(--main);background:var(--main);color:#fff}
/* L1 scene */
#l1svg .sky{transition:fill 1.6s}
#l1svg .sun{transition:transform 2.2s ease-in-out}
#l1svg .sunspin{animation:spin 3s linear infinite;transform-origin:0 0}
@keyframes spin{to{transform:rotate(360deg)}}
#l1svg .fade{transition:opacity 1.4s}
#l1svg .walker{transition:transform 3s ease-in-out,opacity 1s}
#l1svg .zz{animation:zz 2.4s ease-in-out infinite}
@keyframes zz{0%{opacity:0;transform:translateY(0)}50%{opacity:1}100%{opacity:0;transform:translateY(-18px)}}
#l1svg .vine{stroke-dasharray:420;stroke-dashoffset:420;transition:stroke-dashoffset 4s ease}
#l1svg.s3 .vine{stroke-dashoffset:0}
#l1svg .river{stroke-dasharray:14 12;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-26}}
#l1svg .fly{animation:blink 1.6s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
#l1svg .twk{animation:blink 2.2s ease-in-out infinite}
/* L2 */
#l2svg .top{transition:transform 1.2s ease;transform-box:view-box;transform-origin:530px 262px}
#l2svg .fade{transition:opacity 1.2s}
#l2svg .layer{transition:opacity .6s, r .6s}
#l2svg .shine{animation:blink 1.8s ease-in-out infinite}
#l2svg .grain{transition:transform 1.4s cubic-bezier(.5,0,.6,1.4)}
/* L3 */
#l3svg .fade{transition:opacity 1s}
#l3svg .crank{animation:spin 1s linear infinite;transform-box:fill-box;transform-origin:center}
#l3svg .flake{animation:fall 1.4s linear infinite}
@keyframes fall{0%{transform:translateY(0);opacity:1}100%{transform:translateY(95px);opacity:.2}}
#l3svg .pile{transform-box:fill-box;transform-origin:bottom center;animation:grow 6s ease-out infinite}
@keyframes grow{0%{transform:scaleY(.1)}70%,100%{transform:scaleY(1)}}
#l3svg .bike{animation:ride 7s linear infinite}
@keyframes ride{0%{transform:translateX(-160px)}100%{transform:translateX(860px)}}
#l3svg .ring{animation:blink .6s ease-in-out infinite}
/* punct */
.ps{font-size:1.5rem;letter-spacing:.12em;text-align:center;padding:18px 8px;background:#f3f6fb;border-radius:14px;line-height:2.2}
.ps .p{color:var(--accent-2);font-weight:900;display:inline-block;animation:drop .5s ease}
@keyframes drop{0%{transform:translateY(-30px);opacity:0}100%{transform:none;opacity:1}}
.meaning{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--hi);min-height:52px}

/* ---------- 快問快答 ---------- */
.qz-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.timer{height:8px;background:#eef1f6;border-radius:99px;overflow:hidden;margin:12px 0 4px}
.timer i{display:block;height:100%;background:var(--accent);width:100%}
.qword{font-size:2.3rem;font-weight:900;text-align:center;margin:14px 0 6px;letter-spacing:.08em}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.opt{border:2px solid var(--line);background:#fff;border-radius:14px;padding:14px;font-size:1.3rem;font-weight:700;transition:transform .1s}
.opt:active{transform:scale(.97)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.combo{font-weight:900;color:var(--accent-2)}
.star{color:var(--accent-2);font-size:1rem;font-weight:700}

/* ---------- 配對 ---------- */
.mcols{display:grid;grid-template-columns:1fr 1.6fr;gap:14px}
.mi{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;margin:0 0 10px;font-size:1rem;min-height:48px}
.mi.sel{border-color:var(--main-2);background:#e8effa}
.mi.done{border-color:var(--ok);background:var(--ok-bg);color:#1c6b47;cursor:default}
.mi.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.mi.w{font-weight:900;font-size:1.15rem}

/* ---------- 分類 ---------- */
.sortcard{font-size:1.25rem;font-weight:700;text-align:center;background:#f3f6fb;border-radius:14px;padding:22px 12px;margin:10px 0 14px;min-height:90px;display:flex;align-items:center;justify-content:center}
.buckets{display:grid;gap:10px}
.bk{border:2px dashed var(--main-2);background:#fff;border-radius:14px;padding:12px;font-weight:700;color:var(--main)}
.bk.ok{background:var(--ok-bg);border-style:solid;border-color:var(--ok)}
.bk.bad{background:var(--bad-bg);border-style:solid;border-color:var(--bad)}
.fb{min-height:28px;margin-top:10px}

/* ---------- 選擇題 ---------- */
.mq{border-top:1px solid var(--line);padding:16px 0}
.mq:first-of-type{border-top:none}
.mq .stem{font-weight:500;margin-bottom:8px}
.mq .src{font-size:1rem;color:#fff;background:var(--main-2);border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:2px}
.mq .o{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;margin:6px 0;font-size:1rem}
.mq .o.ok{border-color:var(--ok);background:var(--ok-bg)}
.mq .o.bad{border-color:var(--bad);background:var(--bad-bg)}
.mq .ex{display:none;background:#fffaf0;border:1px solid #f2dfb5;border-radius:12px;padding:10px 14px;margin-top:8px}
.mq.done .ex{display:block}
.score{position:sticky;top:62px;z-index:5;background:#fff;border-radius:12px;padding:8px 14px;box-shadow:var(--shadow);display:inline-block;margin-bottom:8px;font-weight:700}

/* ---------- 抓擬人 ---------- */
.hunt p{font-size:1.2rem;line-height:2.2;margin:6px 0}
.hunt span.c{cursor:pointer;border-radius:4px;padding:1px 0}
.hunt span.c.found{background:#ffe08a;color:#7a4b00;font-weight:900}
.hunt span.c.miss{background:var(--bad-bg);transition:background .6s}

/* ---------- 翻卡 ---------- */
.flips{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.flip{perspective:800px;height:150px;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .bk2{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:var(--shadow)}
.flip .f{background:#fff}
.flip .f .sym{font-size:2rem;font-weight:900;color:var(--accent-2)}
.flip .bk2{background:var(--main);color:#fff;transform:rotateY(180deg);font-size:1rem;line-height:1.5}


/* 照片舞台 */
.pstage{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#111}
.ph{position:absolute;inset:0;background-position:center;background-repeat:no-repeat;background-size:cover;opacity:0;transition:opacity 1.2s ease}
.ph.kb{animation:kb 9s ease-out forwards}
@keyframes kb{0%{transform:scale(1.0)}100%{transform:scale(1.08)}}
.split{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;gap:4px;opacity:0;transition:opacity 1s}
.split .half{background-size:cover;background-position:center;position:relative}
.split .half span,.ptag{position:absolute;left:12px;bottom:12px;background:rgba(0,0,0,.62);color:#fff;border-radius:10px;padding:6px 12px;font-size:1rem;line-height:1.5;max-width:calc(100% - 24px)}
.ptag{transition:opacity .6s}
.pai{position:absolute;right:10px;top:10px;background:rgba(255,255,255,.85);color:#555;border-radius:8px;padding:2px 10px;font-size:1rem;opacity:0;transition:opacity .6s}
@media(max-width:560px){.pstage{aspect-ratio:4/3}}
.bgm{position:fixed;right:14px;bottom:14px;z-index:30;border:none;background:#fff;color:var(--main);border-radius:99px;padding:8px 16px;box-shadow:var(--shadow);font-weight:700}
/* 自學一 */
.tstage{background:linear-gradient(135deg,#eef6e8,#fdf6e3);border-radius:16px;min-height:260px;display:flex;align-items:center;justify-content:center;padding:20px}
.qcard{text-align:center;max-width:640px}
.qe{font-size:3rem}.qq{font-size:1.4rem;font-weight:700;line-height:1.7;margin:8px 0;color:#2d4a22}.qw{color:var(--muted);font-size:1.05rem}
.pop{animation:pop .6s ease}
@keyframes pop{0%{opacity:0;transform:scale(.9) translateY(10px)}100%{opacity:1;transform:none}}
.mx{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:620px}
.mxc{border-radius:14px;padding:16px;color:#fff;display:flex;flex-direction:column;gap:4px;font-size:1.05rem}
.mxc b{font-size:1.15rem}
@media(max-width:560px){.tstage{padding:10px}.mxc{padding:12px}}.mxc.a{background:#d9534f}.mxc.b{background:#2e9e6b}.mxc.c{background:#f0ad4e}.mxc.d{background:#8a94a2}
footer{background:#5e2709;color:#dfe7f3;padding:28px 0;font-size:1rem}
footer a{color:#ffd48a}

.hero .me{margin-top:12px;display:inline-flex;gap:8px;align-items:center;background:rgba(255,255,255,.16);padding:4px 12px;border-radius:99px;font-size:1rem}
.linkbtn{border:none;background:#fff;color:var(--main);border-radius:99px;padding:1px 12px;font-weight:700;font-size:1rem}
.modal{position:fixed;inset:0;background:rgba(20,30,45,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:#fff;border-radius:18px;padding:22px;width:100%;max-width:420px;box-shadow:var(--shadow)}
.mbox label{display:block;margin:10px 0;font-weight:500}
.mbox input{display:block;width:100%;font-size:1.1rem;padding:9px 12px;border:2px solid var(--line);border-radius:10px;margin-top:4px;font-family:inherit}
.mbox input:focus{outline:none;border-color:var(--main-2)}
.btn:disabled{opacity:.7}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;font-size:20px}
.mq .ex{font-size:1.12rem;line-height:1.75}
.caption .key,.caption .poem{font-size:1.12rem}
.fb{font-size:1.05rem}

.qword.en{font-size:1.9rem;letter-spacing:0;word-break:break-word;font-family:"Nunito","Noto Sans TC",sans-serif}
.say{border:0;background:#f8e9dc;border-radius:99px;width:48px;height:48px;font-size:1.3rem;vertical-align:middle;margin-left:6px}
.opt{font-size:1.15rem;word-break:break-word}
.en{font-family:"Nunito","Noto Sans TC",sans-serif}
.hunt .en p{font-size:1.15rem;line-height:2;margin:4px 0}
.hunt span.c.w{padding:2px 3px;border-radius:6px}
.passage{background:#fbf4ec;border-radius:12px;padding:14px 16px;line-height:1.9;margin-bottom:10px}
.passage .blank{color:var(--accent-2)}
.flips.tr .flip{min-height:150px}
.flips.tr .bk2{display:flex;flex-direction:column;gap:6px;justify-content:center}
.flips.tr .bk2 .en{font-weight:700;font-size:1.05rem}
.flips.tr .bk2 small{font-size:1rem;opacity:.85}
.ps.en{letter-spacing:0;font-size:1.35rem;line-height:1.7}
.ps.pop{animation:pop .45s ease}
@keyframes pop{0%{transform:scale(.9);opacity:.3}100%{transform:scale(1);opacity:1}}
.bk{min-width:0;overflow-wrap:anywhere}

/* 國小版：emoji 場景舞台 */
.estage{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:linear-gradient(160deg,#fff7e0,#ffe2c2 55%,#ffd0a8);display:flex;align-items:center;justify-content:center;flex-direction:column}
.estage .emo{font-size:clamp(3.2rem,11vw,7rem);line-height:1.15;text-align:center;letter-spacing:.08em;animation:bob 2.4s ease-in-out infinite}
.estage .emo span{display:inline-block;animation:popin .6s ease both}
.estage .etag{margin-top:12px;background:rgba(255,255,255,.9);border-radius:99px;padding:6px 18px;font-weight:900;font-size:1.25rem;color:#5b3a12;font-family:Nunito,"Noto Sans TC",sans-serif;max-width:92%;text-align:center}
.estage .esay{position:absolute;right:12px;top:12px;border:none;background:#fff;border-radius:99px;padding:6px 14px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.12)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes popin{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.exam-h{margin:26px 0 10px;font-size:1.15rem;color:var(--main);font-weight:900}
.chips span.n0{opacity:.6}
.vtable{width:100%;border-collapse:collapse;font-size:1rem}
.vtable th,.vtable td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
.vtable th{color:var(--muted);font-weight:500}

</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <a href="../" style="color:#fff;opacity:.85;text-decoration:none;font-size:1rem;display:block;margin-bottom:8px">← 回英文選單</a><span class="tag">何嘉仁版 四上（Super Fun 3）｜ 第二次段考</span>
    <h1>英文段考闖關｜房間＋寵物＋短母音</h1>
    <p>先看動畫跟著唸，再用遊戲練熟房間、寵物和短母音，最後做段考模擬題、交卷給老師。</p>
    <div class="me" id="me"></div>
  </div>
</header>
<nav class="tabs"><div class="wrap" id="tabs"></div></nav>
<main><div class="wrap" id="app"></div></main>
<footer><div class="wrap">全民補習班 ‧ 國小英文段考闖關 ‧ 題目全數自編　發音：瀏覽器英語語音</div></footer>

<script>
/* ================= 音效 ================= */
let AC=null;
function tone(f,d=0.12,type='sine',v=0.15,delay=0){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.value=f;g.gain.value=v;
    o.connect(g);g.connect(AC.destination);
    const t=AC.currentTime+delay;
    o.start(t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.stop(t+d+0.02);
  }catch(e){}
}
const sOK=()=>{tone(660,.1);tone(990,.15,'sine',.15,.09)};
const sBAD=()=>tone(180,.25,'square',.08);
const sBELL=()=>{[1568,2093,1568,2093].forEach((f,i)=>tone(f,.18,'triangle',.08,i*.14))};

/* ================= 工具 ================= */
const $=(s,r=document)=>r.querySelector(s);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const isZY=s=>/[ㄅ-ㄩ]/.test(s);

/* ================= 注釋配對 ================= */
function renderMatch(el,pairs){
  const rounds=[];const sp=shuf(pairs);for(let k=0;k<sp.length;k+=5)rounds.push(sp.slice(k,k+5));
  let r=0,miss=0;
  function draw(){
    const set=rounds[r];const rights=shuf(set);let sel=null,done=0;
    el.innerHTML=`<div class="card"><div class="qz-top"><h3 style="margin:0">🔗 注釋配對　第 ${r+1} / ${rounds.length} 回</h3><span class="muted">先點左邊的詞，再點右邊的解釋</span></div>
      <div class="mcols" style="margin-top:14px"><div>${set.map((p,k)=>`<button class="mi w" data-w="${k}">${esc(p[0])}</button>`).join('')}</div>
      <div>${rights.map(p=>`<button class="mi" data-m="${set.indexOf(p)}">${esc(p[1])}</button>`).join('')}</div></div></div>`;
    el.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{if(b.classList.contains('done'))return;el.querySelectorAll('[data-w]').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=b});
    el.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{
      if(!sel||b.classList.contains('done'))return;
      if(sel.dataset.w===b.dataset.m){sOK();sel.classList.remove('sel');sel.classList.add('done');b.classList.add('done');sel=null;done++;
        if(done===set.length)setTimeout(()=>{r++;if(r<rounds.length)draw();else fin()},600)}
      else{sBAD();miss++;b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),400)}
    });
  }
  function fin(){el.innerHTML=`<div class="card" style="text-align:center"><div style="font-size:3rem">${miss<=2?'🏆':'👍'}</div><h3>全部配對完成！</h3><p>配錯 ${miss} 次</p><button class="btn" id="ag">再玩一次（題目重新洗牌）</button></div>`;$('#ag',el).onclick=()=>renderMatch(el,pairs)}
  draw();
}

/* ================= 分類 ================= */
function renderSort(el,so){
  let order=shuf(so.items),i=0,ok=0,wrongs=[];
  function draw(){
    if(i>=order.length){
      el.innerHTML=`<h3>${so.title}</h3><div style="text-align:center"><div style="font-size:2.6rem">${ok===order.length?'🏆':'👍'}</div><p><b>${ok} / ${order.length}</b> 題正確</p>
      ${wrongs.length?`<div style="text-align:left;background:#fffaf0;border-radius:12px;padding:10px 14px">${wrongs.map(w=>`「${esc(w[0])}」→ <b>${so.buckets[w[1]]}</b>${w[2]?'：'+esc(w[2]):''}`).join('<br>')}</div>`:''}
      <button class="btn" style="margin-top:12px">再玩一次</button></div>`;
      el.querySelector('.btn').onclick=()=>renderSort(el,so);return;
    }
    const it=order[i];
    el.innerHTML=`<div class="qz-top"><h3 style="margin:0">${so.title}</h3><span class="muted">${i+1} / ${order.length}</span></div>
      <p class="muted" style="margin:4px 0 0">💡 ${so.tip}</p>
      <div class="sortcard">${esc(it[0])}</div>
      <div class="buckets" style="grid-template-columns:repeat(${Math.min(so.buckets.length,5)},1fr)">${so.buckets.map((b,k)=>`<button class="bk" data-k="${k}">${b}</button>`).join('')}</div>
      <div class="fb"></div>`;
    if(window.innerWidth<560&&so.buckets.length>3) el.querySelector('.buckets').style.gridTemplateColumns='1fr 1fr';
    el.querySelectorAll('.bk').forEach(b=>b.onclick=()=>{
      el.querySelectorAll('.bk').forEach(x=>x.onclick=null);
      const right=+b.dataset.k===it[1];
      el.querySelector(`.bk[data-k="${it[1]}"]`).classList.add('ok');
      if(right){sOK();ok++}else{sBAD();b.classList.add('bad');wrongs.push(it)}
      el.querySelector('.fb').innerHTML=(right?'✅ 正確！':'❌ 應該是「'+so.buckets[it[1]]+'」')+(it[2]?'　'+esc(it[2]):'');
      i++;setTimeout(draw,right?800:1900);
    });
  }
  draw();
}

/* ================= 選擇題 ================= */
function renderMCQ(el,qs){
  let got=0,done=0;
  const list=qs.map(q=>{const idx=shuf(q.o.map((_,k)=>k));return{...q,idx}});
  el.innerHTML=`<div class="score" id="sc">已作答 0 / ${qs.length}　答對 0</div><div class="card">${list.map((q,n)=>`
    <div class="mq" data-n="${n}"><div class="stem">${n+1}. ${esc(q.q)}<span class="src">${q.src}</span></div>
    ${q.idx.map((k,j)=>`<button class="o" data-k="${k}">(${'ABCD'[j]}) ${esc(q.o[k])}</button>`).join('')}
    <div class="ex">💡 <b>解析：</b>${esc(q.ex)}</div></div>`).join('')}
    <div class="row" style="margin-top:12px"><button class="btn ghost" id="rs">${opt.rsLabel||((opt.redraw||/總測驗/.test(title))?'🔀 換一批新題目':'重新作答（選項重新洗牌）')}</button></div></div>`;
  el.querySelectorAll('.mq').forEach(box=>{
    const q=list[+box.dataset.n];
    box.querySelectorAll('.o').forEach(b=>b.onclick=()=>{
      if(box.classList.contains('done'))return;box.classList.add('done');done++;
      box.querySelector(`.o[data-k="${q.a}"]`).classList.add('ok');
      if(+b.dataset.k===q.a){got++;sOK()}else{b.classList.add('bad');sBAD()}
      $('#sc',el).textContent=`已作答 ${done} / ${qs.length}　答對 ${got}`+(done===qs.length?`　🎯 得分 ${Math.round(got/qs.length*100)}`:'');
    });
  });
  $('#rs',el).onclick=()=>renderMCQ(el,qs);
}

/* ================= 動畫共用 ================= */
function stepper(el,steps,apply,autoMs=5200){
  let k=0,auto=null;
  el.querySelector('.steps').innerHTML=steps.map((s,i)=>`<button data-i="${i}">${s.label}</button>`).join('')+`<button id="play">▶ 自動播放</button>`;
  function set(i){k=i;el.querySelectorAll('.steps [data-i]').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));
    const s=steps[i];el.querySelector('.caption').innerHTML=`<div class="poem">${s.poem}</div><div class="key">🎯 <b>考點：</b>${s.key}</div>`;apply(i)}
  el.querySelectorAll('.steps [data-i]').forEach(b=>b.onclick=()=>{stop();set(+b.dataset.i)});
  const pb=el.querySelector('#play');
  function stop(){clearInterval(auto);auto=null;pb.textContent='▶ 自動播放'}
  pb.onclick=()=>{if(auto)return stop();pb.textContent='⏸ 暫停';set(0);auto=setInterval(()=>{if(k+1>=steps.length)return stop();set(k+1)},autoMs)};
  set(0);
}

let __cyc=null,__front='A';
function showPhoto(step){
  clearInterval(__cyc);
  const S=$('#phS'),T=$('#phT'),AI=$('#phAI');
  if(step.split){
    $('#phA').style.opacity=0;$('#phB').style.opacity=0;
    S.innerHTML=step.split.map(s=>`<div class="half" style="background-image:url(img/${s.img}.jpg)"><span>${s.tag}</span></div>`).join('');
    S.style.opacity=1;T.style.opacity=0;AI.style.opacity=step.split.some(s=>AI_IMG(s.img))?1:0;return;
  }
  S.style.opacity=0;
  const imgs=step.imgs;let k=0;
  const put=()=>{
    const it=imgs[k%imgs.length];
    const next=__front==='A'?'B':'A',el=$('#ph'+next),old=$('#ph'+__front);
    el.style.backgroundImage=`url(img/${it.img}.jpg)`;
    el.style.backgroundSize=it.fit||'cover';el.style.backgroundColor=it.bg||'#111';
    el.classList.remove('kb');void el.offsetWidth;el.classList.add('kb');
    el.style.opacity=1;old.style.opacity=0;__front=next;
    T.textContent=it.tag;T.style.opacity=1;AI.style.opacity=AI_IMG(it.img)?1:0;k++;
  };
  put();if(imgs.length>1)__cyc=setInterval(put,3400);
}

/* ================= 背景音樂（瀏覽器即時合成，只在動畫頁播放） ================= */
const BGM={ctx:null,master:null,timer:null,playing:false,
  get on(){try{return localStorage.getItem('bgm')!=='off'}catch(e){return true}},
  set on(v){try{localStorage.setItem('bgm',v?'on':'off')}catch(e){}},
  start(){
    if(!this.on||this.playing)return;
    try{
      this.ctx=this.ctx||new (window.AudioContext||window.webkitAudioContext)();
      if(this.ctx.state==='suspended')this.ctx.resume();
      const c=this.ctx;this.master=c.createGain();this.master.gain.value=0;
      const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1200;
      this.master.connect(lp);lp.connect(c.destination);
      this.master.gain.linearRampToValueAtTime(0.05,c.currentTime+2);
      // 輕快版：約 100 BPM，C–G–Am–F 大調進行，撥弦琶音＋輕低音＋淡淡鋪底
      const BEAT=0.6,prog=[[261.6,329.6,392],[196,246.9,293.7],[220,261.6,329.6],[174.6,220,261.6]];
      const tone2=(f,t,dur,type,vol,att=.01)=>{const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;
        g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
        o.connect(g);g.connect(this.master);o.start(t);o.stop(t+dur+.05)};
      const pat=[0,1,2,1,0,2,1,2];let bar=0;
      const play=()=>{
        const t0=c.currentTime+.05,ch=prog[bar%prog.length];
        ch.forEach(f=>tone2(f,t0,BEAT*4,'sine',.07,.4));                       // 淡淡鋪底
        tone2(ch[0]/2,t0,BEAT*1.2,'triangle',.22);tone2(ch[0]/2,t0+BEAT*2,BEAT*1.2,'triangle',.18); // 低音
        pat.forEach((k,i)=>{const f=ch[k]*2;tone2(f,t0+i*BEAT/2,.35,'triangle',.16)}); // 撥弦琶音（八分音符）
        if(bar%2===1)[0,1,2,3].forEach(i=>tone2([784,659.3,587.3,523.3,659.3][(bar+i)%5],t0+BEAT*2+i*BEAT/2,.5,'sine',.08)); // 小旋律
        bar++;
      };
      play();this.timer=setInterval(play,2400);this.playing=true;
    }catch(e){}
    this.btn();
  },
  stop(){
    clearInterval(this.timer);this.timer=null;
    if(this.playing&&this.master&&this.ctx){const m=this.master,t=this.ctx.currentTime;m.gain.cancelScheduledValues(t);m.gain.setValueAtTime(m.gain.value,t);m.gain.linearRampToValueAtTime(0,t+1.2);setTimeout(()=>{try{m.disconnect()}catch(e){}},1500)}
    this.playing=false;this.btn();
  },
  btn(){const b=document.getElementById('bgmBtn');if(b)b.textContent=this.on?'🎵 音樂：開':'🔇 音樂：關'}
};


/* 交卷給老師引擎（段考模擬題／快問快答／分類挑戰／配對 都可交卷）。

/* ================= 交卷給老師（雲端） =================
   後端：段考闖關成績（assets/v2/backend/Code.gs），不用班級碼；每個網站一個 subject、試算表一個分頁。
   round 編碼：單元代碼×10＋題型（0＝段考模擬題、1＝快問快答、2＝分類、3＝配對）；總測驗＝90。 */
/* 姓名：每站 localStorage ＋ 整個 efetl.com 共用的 cookie。
   一科填名字，其他科也認得；任一科按「登出」，所有科目一起登出（各站是不同網域，靠 efetl_logout 時間戳讓舊名字失效）。 */
const efetlMe={
  dom:/(^|\.)efetl\.com$/.test(location.hostname)?';domain=efetl.com':'',
  ck(k){const m=document.cookie.match('(?:^|; )'+k+'=([^;]*)');return m?decodeURIComponent(m[1]):''},
  setck(k,v,age){document.cookie=k+'='+encodeURIComponent(v)+';path=/;max-age='+age+';SameSite=Lax'+this.dom},
  get(sub){
    try{const c=this.ck('efetl_student');if(c){const o=JSON.parse(c);if(o&&o.name)return {name:o.name}}}catch(e){}
    try{
      const o=JSON.parse(localStorage.getItem(sub+'_student')||'null');if(!o||!o.name)return null;
      const out=+this.ck('efetl_logout')||0;
      if(out&&(o.t||0)<out){localStorage.removeItem(sub+'_student');localStorage.removeItem(sub+'_history');return null}
      this.setck('efetl_student',JSON.stringify({name:o.name}),31536000);
      return {name:o.name};
    }catch(e){return null}
  },
  set(sub,o){try{localStorage.setItem(sub+'_student',JSON.stringify({name:o.name,t:Date.now()}))}catch(e){}
    this.setck('efetl_student',JSON.stringify({name:o.name}),31536000)},
  out(sub){try{localStorage.removeItem(sub+'_student');localStorage.removeItem(sub+'_history')}catch(e){}
    this.setck('efetl_student','',0);this.setck('efetl_logout',String(Date.now()),31536000)}
};
const CLOUD={
  endpoint:'https://script.google.com/macros/s/AKfycbzPt9-_BdRtHhH6f6GAuE9LLRXK8m3j7uavDxpm0xaaJCitl2KfOoYcviYgDZNdNjflLg/exec',   /* 段考闖關成績後端（assets/v2/backend/Code.gs），不用班級碼 */
  subject:'es-eng4-hess-2',
  site:'英文 國小四上第二次段考（何嘉仁）',   /* 試算表分頁名稱，例「英文 國二上第一次段考」 */
  get me(){return efetlMe.get(this.subject)},
  set me(o){efetlMe.set(this.subject,o)},
  upload(rec){
    const m=this.me;if(!m)return false;
    const body=Object.assign({name:m.name,subject:this.subject,site:this.site},rec);
    try{fetch(this.endpoint,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)})}catch(e){return false}
    try{const h=JSON.parse(localStorage.getItem('es-eng4-hess-2_history')||'[]');h.push({...rec,date:new Date().toISOString()});localStorage.setItem('es-eng4-hess-2_history',JSON.stringify(h.slice(-200)))}catch(e){}
    return true;
  }
};

/* 填寫姓名視窗（只要中文姓名）；成功後呼叫 then() */
function enroll(then,force){
  if(document.getElementById('enr'))return;
  const m=CLOUD.me||{};
  document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="enr"><div class="mbox">
    <h3>${force?'👋 歡迎！請先填姓名':'📝 交卷前先填姓名'}</h3><p class="muted">老師會用你的姓名收到成績和錯題。</p>

    <div class="fb" id="eMsg"></div>
    <div class="row" style="justify-content:flex-end">${force?'':'<button class="btn ghost" id="eNo">取消</button>'}<button class="btn" id="eOk">確定</button></div></div></div>`);
  const close=()=>$('#enr').remove();
  if($('#eNo'))$('#eNo').onclick=close;
  $('#eName').focus();
  $('#eName').onkeydown=e=>{if(e.key==='Enter')$('#eOk').click()};
  $('#eOk').onclick=()=>{
    const name=$('#eName').value.trim();
    if(!name){$('#eMsg').textContent='請填入你的中文姓名喔！';return}
    if(!/^[\u4e00-\u9fff·．]{2,6}$/.test(name)){$('#eMsg').textContent='請填中文姓名（2～6 個字），老師才認得出你。';return}
    CLOUD.me={name};close();meChip();then();
  };
}
const KINDS=['段考模擬題','快問快答','分類挑戰','配對'];
/* 交卷：rec={code,type,title,total,correct,blank,wrong:[{q,my,a}]} */
function submitToTeacher(rec,btn){
  const go=()=>{
    const ok=CLOUD.upload({round:rec.code*10+rec.type,score:Math.round(rec.correct/rec.total*100),total:rec.total,correct:rec.correct,blank:rec.blank||0,
      ans:[`【交卷】${rec.title}｜${KINDS[rec.type]}｜答對 ${rec.correct}/${rec.total}`,
        ...rec.wrong.map(w=>`✗ 題目：${String(w.q).replace(/｜/g,'/')}｜學生答：${w.my}｜正解：${w.a}${w.u?'｜單元：'+w.u:''}`)]});
    if(btn){btn.disabled=true;btn.textContent=ok?'✅ 已交給老師':'⚠️ 送出失敗，請再試一次';if(!ok)btn.disabled=false}
  };
  if(!CLOUD.me)return enroll(go);
  go();
}

/* ================= 快問快答（交卷版） ================= */
function renderQuick(el,items,d,code,title){
  let order,i,score,combo,best,wrong,timer,left,round=0;
  const TIME=10;
  function start(list){order=shuf(list||items);i=0;score=0;combo=0;best=0;wrong=[];round++;next()}
  function next(){
    clearInterval(timer);
    if(i>=order.length) return end();
    const [q,a,ds,hot,ask0]=order[i];
    const opts=shuf([a,...ds]);
    const ask=ask0||(d&&d.quickAsk)||(isZY(a)?'選出「」內字的正確讀音':'選出「」內注音的正確國字');
    el.innerHTML=`<div class="card">
      <div class="qz-top"><b>第 ${i+1} / ${order.length} 題</b><span>得分 <b>${score}</b>　<span class="combo">${combo>=2?'🔥 連對 '+combo:''}</span></span></div>
      <div class="timer"><i id="tb"></i></div>
      <p class="muted" style="text-align:center;margin:8px 0 0">${ask} ${hot?`<span class="star">★${hot} 校考過</span>`:''}</p>
      <div class="qword">${esc(q)}</div>
      <div class="opts">${opts.map(o=>`<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>
    </div>`;
    left=TIME;const tb=$('#tb',el);
    timer=setInterval(()=>{left-=.1;tb.style.width=Math.max(0,left/TIME*100)+'%';if(left<=0){clearInterval(timer);pick(null)}},100);
    el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(b));
    function pick(b){
      clearInterval(timer);
      el.querySelectorAll('.opt').forEach(x=>{x.onclick=null;if(x.dataset.v===a)x.classList.add('ok')});
      if(b&&b.dataset.v===a){sOK();window.WB&&WB.hit('q',order[i]);combo++;best=Math.max(best,combo);score+=10+Math.round(left)+(combo>=3?5:0)}
      else{sBAD();if(b)b.classList.add('bad');combo=0;wrong.push({item:order[i],my:b?b.dataset.v:'（超時）'});window.WB&&WB.miss('q',order[i],title,(d&&d.quickAsk)||'')}
      i++;setTimeout(next,b&&b.dataset.v===a?650:1400);
    }
  }
  function end(){
    const n=order.length,acc=Math.round((n-wrong.length)/n*100),full=true,retry=order.length!==items.length;
    el.innerHTML=`<div class="card" style="text-align:center">
      <div style="font-size:3rem">${acc>=90?'🏆':acc>=70?'👍':'💪'}</div>
      <h3>完成！正確率 ${acc}%</h3><p>總分 <b>${score}</b>　最高連對 <b>${best}</b></p>
      ${wrong.length?`<div style="text-align:left;background:#fffaf0;border-radius:12px;padding:12px 16px;margin:12px 0"><b>要再加強的：</b><br>${wrong.map(w=>`${esc(w.item[0])} → <b>${esc(w.item[1])}</b>（你選：${esc(w.my)}）`).join('<br>')}</div>`:''}
      <div class="row" style="justify-content:center">
        ${full?'<button class="btn alt" id="sub">📤 交卷給老師</button>':''}
        ${wrong.length?'<button class="btn ghost" id="rw">只練錯的題目</button>':''}<button class="btn" id="ra">全部重來</button></div>
      ${full?'<p class="muted" style="margin-top:8px">交卷會把你的姓名、分數和錯的題目傳給老師。</p>':''}</div>`;
    $('#ra',el).onclick=()=>start();
    const rw=$('#rw',el); if(rw) rw.onclick=()=>start(wrong.map(w=>w.item));
    const sb=$('#sub',el); if(sb) sb.onclick=()=>submitToTeacher({code,type:1,title:title+(retry?'（只練錯題）':''),total:n,correct:n-wrong.length,
      wrong:wrong.map(w=>({q:w.item[0],my:w.my,a:w.item[1]}))},sb);
  }
  el.innerHTML=`<div class="card" style="text-align:center"><div style="font-size:3rem">⚡</div><h3>${d&&d.quickAsk?'詞性＋量詞快問快答':'字音字形快問快答'}</h3>
  <p>每題 10 秒，越快答對分數越高，連對 3 題以上有加分！<br>做完可以按「交卷給老師」。</p><button class="btn alt" id="go">開始挑戰（${items.length} 題）</button></div>`;
  $('#go',el).onclick=()=>start();
}

/* ================= 選擇題（交卷版） ================= */
function renderMCQ(el,qs,code,title,opt={}){
  let got=0,done=0;
  const list=qs.map(q=>{const idx=shuf(q.o.map((_,k)=>k));return{...q,idx,my:null}});
  el.innerHTML=`<div class="score" id="sc">已作答 0 / ${qs.length}　答對 0</div><div class="card">${list.map((q,n)=>`
    <div class="mq" data-n="${n}"><div class="stem">${n+1}. ${esc(q.q)}${q.src?`<span class="src">${esc(q.src)}</span>`:''}</div>
    ${q.idx.map((k,j)=>`<button class="o" data-k="${k}">(${'ABCD'[j]}) ${esc(q.o[k])}</button>`).join('')}
    <div class="ex">💡 <b>解析：</b>${esc(q.ex)}</div></div>`).join('')}
    <div class="row" style="margin-top:14px">${code!=null?'<button class="btn alt" id="sub">📤 交卷給老師</button>':''}<button class="btn ghost" id="rs">${opt.rsLabel||((opt.redraw||/總測驗/.test(title))?'🔀 換一批新題目':'重新作答（選項重新洗牌）')}</button></div>
    ${code!=null?'<p class="muted" id="subtip">全部作答完再交卷；沒作答的題目會算成空白。</p>':''}</div>`;
  el.querySelectorAll('.mq').forEach(box=>{
    const q=list[+box.dataset.n];
    box.querySelectorAll('.o').forEach(b=>b.onclick=()=>{
      if(box.classList.contains('done'))return;box.classList.add('done');done++;
      q.my=+b.dataset.k;
      box.querySelector(`.o[data-k="${q.a}"]`).classList.add('ok');
      if(q.my===q.a){got++;sOK();window.WB&&WB.hit('m',q)}else{b.classList.add('bad');sBAD();window.WB&&WB.miss('m',q,title)}
      $('#sc',el).textContent=`已作答 ${done} / ${qs.length}　答對 ${got}`+(done===qs.length?`　🎯 得分 ${Math.round(got/qs.length*100)}`:'');
    });
  });
  $('#rs',el).onclick=()=>opt.redraw?opt.redraw():(/總測驗/.test(title)&&typeof render==='function')?render():renderMCQ(el,qs,code,title,opt);
  const sb=$('#sub',el);
  if(sb) sb.onclick=()=>{
    const blank=list.filter(q=>q.my===null).length;
    if(blank&&!confirm(`還有 ${blank} 題沒作答，確定要交卷嗎？`))return;
    submitToTeacher({code,type:0,title,total:list.length,correct:got,blank,
      wrong:list.filter(q=>q.my!==q.a).map(q=>({q:q.q,my:q.my===null?'（空白）':q.o[q.my],a:q.o[q.a],u:q.unit||undefined}))},sb);
  };
}


/* ================= 分類挑戰（交卷版，覆蓋模板版本） ================= */
let SORTCTX=null;   /* {code,title}：由 render() 在單元分類頁設定 */
function renderSort(el,so){
  const ctx=SORTCTX;
  let order=shuf(so.items),i=0,ok=0,wrongs=[];
  function draw(){
    if(i>=order.length){
      el.innerHTML=`<h3>${so.title}</h3><div style="text-align:center"><div style="font-size:2.6rem">${ok===order.length?'🏆':'👍'}</div><p><b>${ok} / ${order.length}</b> 題正確</p>
      ${wrongs.length?`<div style="text-align:left;background:#fffaf0;border-radius:12px;padding:10px 14px">${wrongs.map(w=>`「${esc(w.it[0])}」→ <b>${so.buckets[w.it[1]]}</b>（你選：${esc(so.buckets[w.my])}）${w.it[2]?'：'+esc(w.it[2]):''}`).join('<br>')}</div>`:''}
      <div class="row" style="justify-content:center;margin-top:12px">${ctx?'<button class="btn alt" data-sub>📤 交卷給老師</button>':''}<button class="btn" data-again>再玩一次</button></div></div>`;
      el.querySelector('[data-again]').onclick=()=>{SORTCTX=ctx;renderSort(el,so)};
      const sb=el.querySelector('[data-sub]');
      if(sb) sb.onclick=()=>submitToTeacher({code:ctx.code,type:2,title:`${ctx.title}｜${so.title}`.replace(/｜/g,' ／ '),total:order.length,correct:ok,
        wrong:wrongs.map(w=>({q:`「${w.it[0]}」屬於哪一類？`,my:so.buckets[w.my],a:so.buckets[w.it[1]]}))},sb);
      return;
    }
    const it=order[i];
    el.innerHTML=`<div class="qz-top"><h3 style="margin:0">${so.title}</h3><span class="muted">${i+1} / ${order.length}</span></div>
      <p class="muted" style="margin:4px 0 0">💡 ${so.tip}</p>
      <div class="sortcard">${esc(it[0])}</div>
      <div class="buckets" style="grid-template-columns:repeat(${Math.min(so.buckets.length,5)},1fr)">${so.buckets.map((b,k)=>`<button class="bk" data-k="${k}">${b}</button>`).join('')}</div>
      <div class="fb"></div>`;
    if(window.innerWidth<560&&so.buckets.length>3) el.querySelector('.buckets').style.gridTemplateColumns='1fr 1fr';
    el.querySelectorAll('.bk').forEach(b=>b.onclick=()=>{
      el.querySelectorAll('.bk').forEach(x=>x.onclick=null);
      const right=+b.dataset.k===it[1];
      el.querySelector(`.bk[data-k="${it[1]}"]`).classList.add('ok');
      if(right){sOK();ok++}else{sBAD();b.classList.add('bad');wrongs.push({it,my:+b.dataset.k})}
      el.querySelector('.fb').innerHTML=(right?'✅ 正確！':'❌ 應該是「'+so.buckets[it[1]]+'」')+(it[2]?'　'+esc(it[2]):'');
      i++;setTimeout(draw,right?800:1900);
    });
  }
  draw();
}


/* ================= 配對（交卷版，覆蓋模板版本） ================= */
function renderMatch(el,pairs,code,title){
  const rounds=[];const sp=shuf(pairs);for(let k=0;k<sp.length;k+=5)rounds.push(sp.slice(k,k+5));
  let r=0;const missed=new Map();   /* 詞 → {a:正解, my:[配錯的解釋]} */
  function draw(){
    const set=rounds[r];const rights=shuf(set);let sel=null,done=0;
    el.innerHTML=`<div class="card"><div class="qz-top"><h3 style="margin:0">🔗 配對　第 ${r+1} / ${rounds.length} 回</h3><span class="muted">先點左邊的詞，再點右邊的解釋</span></div>
      <div class="mcols" style="margin-top:14px"><div>${set.map((p,k)=>`<button class="mi w" data-w="${k}">${esc(p[0])}</button>`).join('')}</div>
      <div>${rights.map(p=>`<button class="mi" data-m="${set.indexOf(p)}">${esc(p[1])}</button>`).join('')}</div></div></div>`;
    el.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{if(b.classList.contains('done'))return;el.querySelectorAll('[data-w]').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=b});
    el.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{
      if(!sel||b.classList.contains('done'))return;
      if(sel.dataset.w===b.dataset.m){sOK();sel.classList.remove('sel');sel.classList.add('done');b.classList.add('done');sel=null;done++;
        if(done===set.length)setTimeout(()=>{r++;if(r<rounds.length)draw();else fin()},600)}
      else{sBAD();const w=set[+sel.dataset.w],m=missed.get(w[0])||{a:w[1],my:[]};m.my.push(set[+b.dataset.m][1]);missed.set(w[0],m);
        b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),400)}
    });
  }
  function fin(){
    const n=pairs.length,bad=[...missed.entries()];
    el.innerHTML=`<div class="card" style="text-align:center"><div style="font-size:3rem">${bad.length<=2?'🏆':'👍'}</div><h3>全部配對完成！</h3>
      <p>一次就配對成功 <b>${n-bad.length} / ${n}</b> 個</p>
      ${bad.length?`<div style="text-align:left;background:#fffaf0;border-radius:12px;padding:12px 16px;margin:12px 0"><b>曾經配錯的：</b><br>${bad.map(([w,m])=>`${esc(w)} → <b>${esc(m.a)}</b>`).join('<br>')}</div>`:''}
      <div class="row" style="justify-content:center">${code!=null?'<button class="btn alt" id="msub">📤 交卷給老師</button>':''}<button class="btn" id="ag">再玩一次（題目重新洗牌）</button></div></div>`;
    $('#ag',el).onclick=()=>renderMatch(el,pairs,code,title);
    const sb=$('#msub',el);
    if(sb) sb.onclick=()=>submitToTeacher({code,type:3,title,total:n,correct:n-bad.length,
      wrong:bad.map(([w,m])=>({q:`「${w}」的意思`,my:[...new Set(m.my)].join(' / '),a:m.a}))},sb);
  }
  draw();
}


/* ================= 發音（微軟 Neural 語音預錄 mp3；沒有檔才退回瀏覽器語音） ================= */
const isEN=s=>/^[A-Za-z][A-Za-z '’\-\/.…]*$/.test(s.trim());
const normSay=t=>t.replace(/<br\s*\/?>/gi,' ').replace(/<[^>]+>/g,'').replace(/[’‘]/g,"'").replace(/[“”]/g,'"').replace(/…/g,' ').replace(/___+/g,'blank').replace(/\s+/g,' ').trim();
function akey(t){let h=0x811c9dc5;for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return h.toString(16).padStart(8,'0')}
let __au=null;
function stopSay(){try{if(__au)__au.pause();speechSynthesis.cancel()}catch(e){}}
function webSay(t){try{const u=new SpeechSynthesisUtterance(t.replace(/\//g,' or '));u.lang='en-US';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function say(t){
  const n=normSay(t),k=akey(n);stopSay();
  if(typeof AUDIO!=='undefined'&&AUDIO.has(k)){
    if(!__au)__au=new Audio();
    __au.src='audio/'+k+'.mp3';const p=__au.play();if(p&&p.catch)p.catch(()=>webSay(n));
  }else webSay(n);
}

/* ================= 快問快答（英文版＋交卷） ================= */
function renderQuick(el,items,d,code,title){
  let order,i,score,combo,best,wrong,timer,left;
  const TIME=10;
  function start(list){order=shuf(list||items);i=0;score=0;combo=0;best=0;wrong=[];next()}
  function next(){
    clearInterval(timer);
    if(i>=order.length) return end();
    const [q,a,ds,hot,type]=order[i];
    const opts=shuf([a,...ds]);
    const canSay=isEN(q)&&type!=='s'&&type!=='u';
    el.innerHTML=`<div class="card">
      <div class="qz-top"><b>第 ${i+1} / ${order.length} 題</b><span>得分 <b>${score}</b>　<span class="combo">${combo>=2?'🔥 連對 '+combo:''}</span></span></div>
      <div class="timer"><i id="tb"></i></div>
      <p class="muted" style="text-align:center;margin:8px 0 0">${ASK[type]} ${hot?'<span class="star">★ 2 校以上考過</span>':''}</p>
      <div class="qword en">${esc(q)}${canSay?' <button class="say" id="sayq" aria-label="播放發音">🔊</button>':''}</div>
      <div class="opts">${opts.map(o=>`<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>
    </div>`;
    if(canSay) $('#sayq',el).onclick=()=>say(q);
    left=TIME;const tb=$('#tb',el);
    timer=setInterval(()=>{left-=.1;tb.style.width=Math.max(0,left/TIME*100)+'%';if(left<=0){clearInterval(timer);pick(null)}},100);
    el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(b));
    function pick(b){
      clearInterval(timer);
      el.querySelectorAll('.opt').forEach(x=>{x.onclick=null;if(x.dataset.v===esc(a))x.classList.add('ok')});
      const right=b&&b.dataset.v===esc(a);
      if(right){sOK();window.WB&&WB.hit('q',order[i]);combo++;best=Math.max(best,combo);score+=10+Math.round(left)+(combo>=3?5:0)}
      else{sBAD();if(b)b.classList.add('bad');combo=0;wrong.push({item:order[i],my:b?b.textContent:'（超時）'});window.WB&&WB.miss('q',order[i],title,'')}
      if(b&&isEN(a)&&type!=='e'&&type!=='u') say(a);
      i++;setTimeout(next,right?900:1600);
    }
  }
  function end(){
    const n=order.length,acc=Math.round((n-wrong.length)/n*100),retry=n!==items.length;
    el.innerHTML=`<div class="card" style="text-align:center">
      <div style="font-size:3rem">${acc>=90?'🏆':acc>=70?'👍':'💪'}</div>
      <h3>完成！正確率 ${acc}%</h3><p>總分 <b>${score}</b>　最高連對 <b>${best}</b></p>
      ${wrong.length?`<div style="text-align:left;background:#fffaf0;border-radius:12px;padding:12px 16px;margin:12px 0"><b>要再加強的：</b><br>${wrong.map(w=>`${esc(w.item[0])} → <b>${esc(w.item[1])}</b>（你選：${esc(w.my)}）`).join('<br>')}</div>`:''}
      <div class="row" style="justify-content:center">
        ${code!=null?'<button class="btn alt" id="sub">📤 交卷給老師</button>':''}
        ${wrong.length?'<button class="btn ghost" id="rw">只練錯的題目</button>':''}<button class="btn" id="ra">全部重來</button></div>
      ${code!=null?'<p class="muted" style="margin-top:8px">交卷會把你的姓名、分數和錯的題目傳給老師。</p>':''}</div>`;
    $('#ra',el).onclick=()=>start();
    const rw=$('#rw',el); if(rw) rw.onclick=()=>start(wrong.map(w=>w.item));
    const sb=$('#sub',el); if(sb) sb.onclick=()=>submitToTeacher({code,type:1,title:title+(retry?'（只練錯題）':''),total:n,correct:n-wrong.length,
      wrong:wrong.map(w=>({q:`${w.item[0]}（${ASK[w.item[4]]}）`,my:w.my,a:w.item[1]}))},sb);
  }
  el.innerHTML=`<div class="card" style="text-align:center"><div style="font-size:3rem">⚡</div><h3>快問快答</h3>
  <p>每題 10 秒，越快答對分數越高，連對 3 題以上有加分！<br><span class="star">★</span> 表示 2 所以上學校考過。按 🔊 可以聽發音。做完可以按「交卷給老師」。</p><button class="btn alt" id="go">開始挑戰（${items.length} 題）</button></div>`;
  $('#go',el).onclick=()=>start();
}

/* ================= 抓抓樂（以「字」為單位） ================= */
function renderHunt(el,h){
  let total=0,found=0,miss=0,id=0;
  const html=h.lines.map(line=>{
    let out='';const re=/\[([^\]]+)\]|([A-Za-z'’\-]+)|([^A-Za-z\[]+)/g;let m;
    while((m=re.exec(line))){
      if(m[1]){id++;total++;out+=`<span class="c w" data-t="${id}">${esc(m[1])}</span>`}
      else if(m[2]) out+=`<span class="c w">${esc(m[2])}</span>`;
      else out+=esc(m[3]);
    }
    return `<p>${out}</p>`;
  }).join('');
  el.innerHTML=`<div class="card hunt"><div class="qz-top"><h3 style="margin:0">🔍 ${h.title}</h3><b id="hc">找到 0 / ${total}</b></div>
    <p class="muted">${h.tip}</p><div class="en">${html}</div>
    <div class="row" style="margin-top:10px"><button class="btn ghost" id="hs">公布答案</button><button class="btn ghost" id="hr">重來</button></div></div>`;
  el.querySelectorAll('span.c').forEach(s=>s.onclick=()=>{
    const t=s.dataset.t;
    if(t){if(s.classList.contains('found'))return;s.classList.add('found');found++;sOK();say(s.textContent);
      $('#hc',el).textContent=`找到 ${found} / ${total}`+(found===total?'　🏆 全部找到！（點錯 '+miss+' 次）':'')}
    else{miss++;sBAD();s.classList.add('miss');setTimeout(()=>s.classList.remove('miss'),600)}
  });
  $('#hs',el).onclick=()=>{el.querySelectorAll('span.c[data-t]').forEach(g=>g.classList.add('found'));$('#hc',el).textContent=`答案：共 ${total} 個`};
  $('#hr',el).onclick=()=>renderHunt(el,h);
}

      const t=s.books.find(b=>b.key===key&&b.status==='open');
      const href=ROOT+LV+'/'+s.id+'/'+(t?t.path+'/':'');
      return `<a href="${href}" style="--sc:${s.color}" class="${s.id===SUB?'cur':''}" title="${t?`到${s.name}・${GN[g]||''}${VN[v]||''}`:`到${s.name}選單`}">${s.emoji} ${s.name}</a>`;
    }));
    const bar=document.createElement('div');bar.id='subjBar';
    bar.innerHTML=`<span class="lab">📚 換科目${GN[g]?`（${GN[g]}・${VN[v]}）`:''}</span>${links.join('')}`;
    document.body.prepend(bar);
    const c=bar.querySelector('a.cur');if(c)requestAnimationFrame(()=>{bar.scrollLeft=c.offsetLeft-(bar.clientWidth-c.offsetWidth)/2});
  }).catch(()=>{});
})();

</script><!--/subjbar-->
<!--wrongbook--><script>
/* ================= 📒 錯題本＋🎲 隨機總測驗（段考闖關共用） =================
   需要頁面已有交卷引擎：CLOUD、renderQuick、renderMCQ、shuf、esc、$、L（各課資料）。
   引擎裡答錯／答對時會呼叫 WB.miss()／WB.hit()（由 scripts/addwrongbook.py 就地補上那兩行）。
   - 錯題本：快問快答與選擇題答錯就收進來；之後在任何地方答對，就從錯題本拿掉。資料記在這台裝置、跟著姓名走（換人就清空）。
   - 隨機總測驗：從這一站全部選擇題（不含要看表格／承上題的題目）每次抽 25 題，沒抽過的優先，全部輪過一遍才重來。 */
(function(){
  if(typeof CLOUD==='undefined'||typeof renderMCQ!=='function')return;
  const SUB=CLOUD.subject,KEY=SUB+'_wrongbook',SEEN=SUB+'_rtseen',N=25;
  const who=()=>(CLOUD.me&&CLOUD.me.name)||'';
  const load=()=>{try{const o=JSON.parse(localStorage.getItem(KEY)||'null');if(o&&o.owner===who())return o}catch(e){}return{owner:who(),q:[],m:[]}};
  const save=o=>{try{localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}paint()};
  const kq=it=>'q|'+it[0]+'|'+it[1];
  const km=q=>'m|'+q.q+'|'+q.o[q.a];
  window.WB={
    miss(kind,it,title,ask){
      const o=load();
      if(kind==='q'){if(!o.q.some(x=>kq(x.it)===kq(it)))o.q.push({it:[it[0],it[1],it[2],it[3]||0,it[4]||ask||''],t:title||''})}
      else{const q={q:it.q,o:it.o,a:it.a,src:it.src||title||'',ex:it.ex||'',unit:it.unit};if(!o.m.some(x=>km(x)===km(q)))o.m.push(q)}
      save(o);
    },
    hit(kind,it){
      const o=load(),n=o.q.length+o.m.length;
      if(kind==='q')o.q=o.q.filter(x=>kq(x.it)!==kq(it));else o.m=o.m.filter(x=>km(x)!==km(it));
      if(o.q.length+o.m.length!==n)save(o);
    },
    count(){const o=load();return o.q.length+o.m.length}
  };
  /* 登出時一起清掉 */
  if(typeof efetlMe!=='undefined'&&efetlMe.out){const out=efetlMe.out;efetlMe.out=function(sub){out.call(this,sub);try{localStorage.removeItem(KEY);localStorage.removeItem(SEEN)}catch(e){}}}

  /* 題庫：各課的 mcq／gmcq；要看表格、圖或「承上」的題目不抽（總測驗沒附圖表） */
  const CTX=/^\s*[(（]?承上|依表|依圖|上表|下表|附表|附圖|上圖|下圖|右圖|左圖|此圖|圖中|表中|如圖|如表|閱讀下文|根據下文|題組/;
  function pool(){
    const out=[],seen=new Set();
    if(typeof L!=='object')return out;
    for(const k of Object.keys(L)){
      const d=L[k];if(!d||typeof d!=='object')continue;
      for(const arr of [d.mcq,d.gmcq]){
        if(!Array.isArray(arr))continue;
        for(const q of arr){
          if(!q||!q.q||!Array.isArray(q.o)||q.a==null||CTX.test(q.q))continue;
          const id=q.q+'|'+q.o[q.a];if(seen.has(id))continue;seen.add(id);
          out.push({...q,src:q.src||d.title||'',unit:q.unit||((d.no||'')+' '+(d.title||'')).trim()});
        }
      }
    }
    return out;
  }
  function draw(){
    const all=pool();if(!all.length)return[];
    let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN)||'[]')}catch(e){}
    let fresh=shuf(all.filter(q=>!seen.includes(q.q)));
    if(fresh.length<Math.min(N,all.length)){seen=[];fresh=shuf(all)}
    const pick=fresh.slice(0,N);
    try{localStorage.setItem(SEEN,JSON.stringify(seen.concat(pick.map(q=>q.q)).slice(-2000)))}catch(e){}
    return pick;
  }

  /* 介面：姓名下面兩顆按鈕＋全螢幕面板 */
  const css=`
  #wbBar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  #wbBar button{border:none;background:#fff;color:var(--main,#2b4c7e);border-radius:99px;padding:5px 14px;font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.12)}
  #wbBar b{display:inline-block;min-width:1.4em;margin-left:4px;background:#e0533f;color:#fff;border-radius:99px;padding:0 6px;font-size:1rem}
  #wbPanel{position:fixed;inset:0;z-index:48;background:var(--bg,#f6f3ec);overflow:auto;-webkit-overflow-scrolling:touch;display:none}
  body.wb-open{overflow:hidden}
  body.wb-open #wbPanel{display:block}
  #wbHead{position:sticky;top:0;z-index:2;background:var(--main,#2b4c7e);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px}
  #wbHead h2{flex:1;margin:0;font-size:1.2rem;color:#fff}
  #wbHead button{border:none;background:#fff;color:var(--main,#2b4c7e);border-radius:99px;padding:5px 14px;font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}
  #wbTabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
  #wbTabs button{border:2px solid var(--main,#2b4c7e);background:#fff;color:var(--main,#2b4c7e);border-radius:99px;padding:5px 14px;font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}
  #wbTabs button.on{background:var(--main,#2b4c7e);color:#fff}
  #wbPanel .wbwrap{max-width:960px;margin:0 auto;padding:0 16px 120px}
  @media print{#wbBar,#wbPanel{display:none!important}}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const P=document.createElement('div');P.id='wbPanel';
  P.innerHTML=`<div id="wbHead"><h2 id="wbTitle"></h2><button id="wbClose">✕ 關閉</button></div><div class="wbwrap"><div id="wbTop"></div><div id="wbBody"></div></div>`;
  document.body.appendChild(P);
  const close=()=>{document.body.classList.remove('wb-open');P.querySelector('#wbBody').innerHTML='';paint()};
  P.querySelector('#wbClose').onclick=close;

  function openBook(tab){
    const o=load(),top=P.querySelector('#wbTop'),body=P.querySelector('#wbBody');
    P.querySelector('#wbTitle').textContent='📒 錯題本';
    document.body.classList.add('wb-open');P.scrollTop=0;
    if(!o.q.length&&!o.m.length){
      top.innerHTML='';body.innerHTML=`<div class="card" style="text-align:center;margin-top:16px"><div style="font-size:3rem">🎉</div><h3>錯題本是空的</h3>
        <p>快問快答和段考模擬題答錯的題目會自動收進來；之後答對就會拿掉。</p></div>`;return;
    }
    tab=tab||(o.m.length?'m':'q');
    top.innerHTML=`<p class="muted" style="margin-top:14px">答錯的題目都在這裡。再答對一次就會從錯題本拿掉。</p>
      <div id="wbTabs"><button data-t="m" class="${tab==='m'?'on':''}">📝 選擇題（${o.m.length}）</button><button data-t="q" class="${tab==='q'?'on':''}">⚡ 快問快答（${o.q.length}）</button>
      <button data-t="x">🗑 清空</button></div>`;
    top.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{
      if(b.dataset.t==='x'){if(confirm('確定要清空錯題本嗎？')){save({owner:who(),q:[],m:[]});openBook()}return}
      openBook(b.dataset.t)});
    if(tab==='m'){
      if(!o.m.length){body.innerHTML='<div class="card"><p>選擇題沒有錯題 👍</p></div>';return}
      renderMCQ(body,shuf(o.m.slice()),0,'📒 錯題本（選擇題）',{redraw:()=>openBook('m'),rsLabel:'🔁 再練一次（答對的已拿掉）'});
    }else{
      if(!o.q.length){body.innerHTML='<div class="card"><p>快問快答沒有錯題 👍</p></div>';return}
      renderQuick(body,o.q.map(x=>x.it),{quickAsk:'選出正確的答案'},0,'📒 錯題本（快問快答）');
      const h=body.querySelector('h3');if(h)h.textContent='📒 錯題快問快答';
    }
  }
  function openTest(){
    const top=P.querySelector('#wbTop'),body=P.querySelector('#wbBody'),pick=draw();
    P.querySelector('#wbTitle').textContent='🎲 隨機總測驗';
    document.body.classList.add('wb-open');P.scrollTop=0;
    if(!pick.length){top.innerHTML='';body.innerHTML='<div class="card"><p>這一站沒有可以抽的選擇題。</p></div>';return}
    const total=pool().length;
    top.innerHTML=`<div class="card" style="margin-top:14px"><b>從這一站 ${total} 題段考模擬題隨機抽 ${pick.length} 題。</b>
      <p class="muted" style="margin:6px 0 0">沒抽過的題目會優先出現，全部輪過一遍才會重複。做完可以交卷給老師；按「🔀 換一批新題目」再抽一份。</p></div>`;
    renderMCQ(body,pick,9,'🎲 隨機總測驗',{redraw:openTest});
  }
  function paint(){
    const me=document.getElementById('me');if(!me)return;
    let bar=document.getElementById('wbBar');
    if(!bar){bar=document.createElement('div');bar.id='wbBar';me.insertAdjacentElement('afterend',bar)}
    const n=WB.count();
    bar.innerHTML=`<button id="wbOpen">📒 錯題本${n?`<b>${n}</b>`:''}</button><button id="wbTest">🎲 隨機總測驗</button>`;
    bar.querySelector('#wbOpen').onclick=()=>openBook();
    bar.querySelector('#wbTest').onclick=openTest;
  }
  paint();
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')paint()});
})();

</script><!--/wrongbook-->
