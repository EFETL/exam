.timer{height:10px;background:rgba(0,0,0,.15);border-radius:6px;overflow:hidden;margin:6px 0}.timer>div{height:100%;background:var(--gold);width:100%}

k": "選出正確的英文", "q": "打架；吵架", "o": ["fight", "fly", "follow", "find"], "a": 0, "ex": ""}, {"id": "u3-q17", "u": "u3", "t": "quick", "ask": "選出正確的英文", "q": "清洗", "o": ["wash", "watch", "wish", "wait"], "a": 0, "ex": ""}, {"id": "u3-q18", "u": "u3", "t": "quick", "ask": "選出正確的英文", "q": "使用", "o": ["use", "see", "sure", "sign"], "a": 0, "ex": ""}, {"id": "u3-q19", "u": "u3", "t": "quick", "ask": "選出正確的英文", "q": "關掉", "o": ["turn off", "turn on", "take off", "wake up"], "a": 0, "ex": ""}, {"id": "u3-q20", "u": "u3", "t": "quick", "ask": "選出正確的英文", "q": "醒來；叫醒…", "o": ["wake up", "wait for", "turn off", "take a walk"], "a": 0, "ex": ""}, {"id": "u3-q21", "u": "u3", "t": "quick", "ask": "選出正確的英文", "q": "（依次輪到的）機會", "o": ["turn", "time", "rule", "place"], "a": 0, "ex": ""}, {"id": "u3-q22", "u": "u3", "t": "quick", "ask": "選出正確的英文", "q": "下課後", "o": ["after class", "in class", "time for class", "before class"], "a": 0, "ex": ""}, {"id": "u3-q23", "u": "u3", "t": "quick", "ask": "選出正確的英文", "q": "跳繩", "o": ["jump rope", "jump rocks", "play rope", "rope jump"], "a": 0, "ex": ""}, {"id": "u3-q24", "u": "u3", "t": "quick", "ask": "選出正確的英文", "q": "畫漫畫", "o": ["draw comics", "read comics", "draw comic book", "write comics"], "a": 0, "ex": ""}, {"id": "u3-q25", "u": "u3", "t": "quick", "ask": "選出正確的拼字", "q": "m _ g _ c（神奇的）", "o": ["magic", "majic", "magec", "megic"], "a": 0, "ex": ""}, {"id": "u3-q26", "u": "u3", "t": "quick", "ask": "選出正確的拼字", "q": "c a r e f _ l（小心的）", "o": ["careful", "carefull", "carful", "cerefull"], "a": 0, "ex": ""}, {"id": "u3-q27", "u": "u3", "t": "quick", "ask": "選出正確的拼字", "q": "m u s e _ m（博物館）", "o": ["museum", "musium", "museam", "muzeum"], "a": 0, "ex": ""}, {"id": "u3-q28", "u": "u3", "t": "quick", "ask": "選出正確的拼字", "q": "q u _ _ t（安靜的）", "o": ["quiet", "quite", "quiat", "qiuet"], "a": 0, "ex": ""}, {"id": "u3-q29", "u": "u3", "t": "quick", "ask": "選出正確的拼字", "q": "d i n _ s a _ r（恐龍）", "o": ["dinosaur", "dinasour", "dinosour", "dinosore"], "a": 0, "ex": ""}, {"id": "u3-q30", "u": "u3", "t": "quick", "ask": "選出正確的拼字", "q": "h _ r r y（快點）", "o": ["hurry", "hurrey", "hury", "harry"], "a": 0, "ex": ""}, {"id": "u3-m31", "u": "u3", "t": "mcq", "ask": "", "q": "A: Can we use the magic door? B: ___ Let's go!", "o": ["Sure.", "No, we can't.", "Be careful.", "I'm not sure."], "a": 0, "ex": "後面說「Let's go!（我們走吧）」，表示答應 → Sure.（當然）。課文：Can we use it? Sure. Let's go!"}, {"id": "u3-m32", "u": "u3", "t": "mcq", "ask": "", "q": "In the lab, please ___ the rules. Don't run or eat there.", "o": ["follow", "fight", "wake", "wash"], "a": 0, "ex": "follow the rules＝遵守規則（follow 17 校考）。"}, {"id": "u3-m33", "u": "u3", "t": "mcq", "ask": "", "q": "Zac, ___ careful. These rocks are not safe.", "o": ["be", "is", "are", "don't"], "a": 0, "ex": "祈使句用原形，careful 是形容詞 → Be careful.（Be 動詞祈使句 26 校考）。不能用 is／are。"}, {"id": "u3-m34", "u": "u3", "t": "mcq", "ask": "", "q": "___ talk in the library, please.", "o": ["Don't", "Not", "No", "Doesn't"], "a": 0, "ex": "否定祈使句：Don't＋原形動詞。"}, {"id": "u3-m35", "u": "u3", "t": "mcq", "ask": "", "q": "It's not safe here. Let's ___ stand on the rocks.", "o": ["not", "don't", "no", "doesn't"], "a": 0, "ex": "Let's 的否定是 Let's not＋原形，沒有 Let's don't（25 校考這個陷阱）。"}, {"id": "u3-m36", "u": "u3", "t": "mcq", "ask": "", "q": "Don't eat ___ drink in the museum.", "o": ["or", "and", "but", "so"], "a": 0, "ex": "否定句連接兩個動作用 or：Don't eat or drink.（課本 Theme Words）"}, {"id": "u3-m37", "u": "u3", "t": "mcq", "ask": "", "q": "Please don't ___ your phone in class.", "o": ["use", "using", "uses", "to use"], "a": 0, "ex": "Don't 後面接原形動詞 use。"}, {"id": "u3-m38", "u": "u3", "t": "mcq", "ask": "", "q": "A: Can Jamie cook? B: ___ But she can jump rope.", "o": ["No, she can't.", "Yes, she can.", "No, she can.", "Yes, she can't."], "a": 0, "ex": "後面用 But 轉折說她「會跳繩」，表示她不會煮飯 → No, she can't."}, {"id": "u3-m39", "u": "u3", "t": "mcq", "ask": "", "q": "Cody is sleeping in class. Let's wake ___ up.", "o": ["him", "he", "his", "he's"], "a": 0, "ex": "wake up 的受詞是代名詞時要放中間，而且用受格：wake him up。"}, {"id": "u3-m40", "u": "u3", "t": "mcq", "ask": "", "q": "Mrs. Lin is in the lab. Let's go talk to ___.", "o": ["her", "she", "hers", "she's"], "a": 0, "ex": "介系詞 to 後面用受格 her。"}, {"id": "u3-m41", "u": "u3", "t": "mcq", "ask": "", "q": "Your phone is ringing in the museum. Please turn ___ off.", "o": ["it", "its", "them", "it's"], "a": 0, "ex": "turn off 的受詞是代名詞 it 時放中間：turn it off。"}, {"id": "u3-m42", "u": "u3", "t": "mcq", "ask": "", "q": "A: What can Yuki do? B: ___", "o": ["She can play baseball.", "Yes, she can.", "She is Yuki.", "No, she can't."], "a": 0, "ex": "What can 問「會做什麼」，要回答能力內容，不能用 Yes／No 回答。"}, {"id": "u3-m43", "u": "u3", "t": "mcq", "ask": "", "q": "___ don't draw on the wall.", "o": ["Tom, please", "Tom please", "Please Tom", "Please, Tom"], "a": 0, "ex": "稱呼人名時，人名後面加逗號：Tom, please don't…；也可以把人名放句尾：Please don't…, Tom.。其他選項都少了人名後面的逗號（Please, Tom don't… 也不對）。"}, {"id": "u3-m44", "u": "u3", "t": "mcq", "ask": "", "q": "With this door, we can go to many ___.", "o": ["places", "place", "placees", "a place"], "a": 0, "ex": "many 後面接複數名詞 places（課文句）。"}, {"id": "u3-m45", "u": "u3", "t": "mcq", "ask": "", "q": "Wait ___ your turn, please.", "o": ["for", "to", "at", "on"], "a": 0, "ex": "wait for…＝等待…；Wait for your turn.（課本 Theme Words）"}, {"id": "u3-m46", "u": "u3", "t": "mcq", "ask": "", "q": "Hurry, ___ we can't see the concert.", "o": ["or", "and", "but", "so"], "a": 0, "ex": "祈使句＋or＝「快一點，否則…」。"}, {"id": "u3-m47", "u": "u3", "t": "mcq", "ask": "", "q": "You can see a \"No Food or Drink\" sign in a ___.", "o": ["museum", "restaurant", "kitchen", "dining room"], "a": 0, "ex": "博物館禁止飲食；餐廳、廚房、飯廳都是吃東西的地方。"}, {"id": "u3-m48", "u": "u3", "t": "mcq", "ask": "", "q": "A: Can't your brother dance? B: ___ He can only sing.", "o": ["No, he can't.", "Yes, he can.", "No, he can.", "Yes, he can't."], "a": 0, "ex": "否定問句照事實回答：他不會跳舞 → No, he can't."}, {"id": "u3-m49", "u": "u3", "t": "mcq", "ask": "", "q": "A: Is the man a police officer? B: Yes. Let's go ___ to him.", "o": ["talk", "talks", "talking", "to talk"], "a": 0, "ex": "Let's go＋原形動詞：Let's go talk to him.（課本 Usage 句型）"}, {"id": "u3-m50", "u": "u3", "t": "mcq", "ask": "", "q": "根據課文，Cody 夢中最後到了哪裡？", "o": ["The Keret House.", "A museum.", "A park.", "A lab."], "a": 0, "ex": "順序：museum（木乃伊）→ park（恐龍）→ the Keret House（床很舒服）→ 被叫醒：Time for class."}, {"id": "u3-m51", "u": "u3", "t": "mcq", "ask": "", "q": "根據課本 Lab Rules，在實驗室可以做哪一件事？", "o": ["Listen to your teacher.", "Run in the lab.", "Eat or drink in the lab.", "Fight with your classmates."], "a": 0, "ex": "Lab Rules：Listen to your teacher. Do not run／eat or drink in the lab. Wash your hands after class."}, {"id": "u4-q52", "u": "u4", "t": "quick", "ask": "選出正確的中文意思", "q": "popular", "o": ["受歡迎的", "有空的", "準備好的", "可愛的"], "a": 0, "ex": ""}, {"id": "u4-q53", "u": "u4", "t": "quick", "ask": "選出正確的中文意思", "q": "ready", "o": ["準備好的", "有空的", "受歡迎的", "安全的"], "a": 0, "ex": ""}, {"id": "u4-q54", "u": "u4", "t": "quick", "ask": "選出正確的中文意思", "q": "concert", "o": ["音樂會；演唱會", "見面會", "派對", "電影"], "a": 0, "ex": ""}, {"id": "u4-q55", "u": "u4", "t": "quick", "ask": "選出正確的中文意思", "q": "fan", "o": ["…迷；粉絲", "樂團", "舞台", "歌手"], "a": 0, "ex": ""}, {"id": "u4-q56", "u": "u4", "t": "quick", "ask": "選出正確的中文意思", "q": "free", "o": ["有空的", "忙碌的", "準備好的", "可愛的"], "a": 0, "ex": ""}, {"id": "u4-q57", "u": "u4", "t": "quick", "ask": "選出正確的中文意思", "q": "weekend", "o": ["週末", "星期", "今天", "平日"], "a": 0, "ex": ""}, {"id": "u4-q58", "u": "u4", "t": "quick", "ask": "選出正確的中文意思", "q": "together", "o": ["一起", "所有的", "現在", "今天"], "a": 0, "ex": ""}, {"id": "u4-q59", "u": "u4", "t": "quick", "ask": "選出正確的中文意思", "q": "band", "o": ["樂團", "舞台", "粉絲", "演唱會"], "a": 0, "ex": ""}, {"id": "u4-q60", "u": "u4", "t": "quick", "ask": "選出正確的中文意思", "q": "report", "o": ["報導", "派對", "簽名", "研讀"], "a": 0, "ex": ""}, {"id": "u4-q61", "u": "u4", "t": "quick", "ask": "選出正確的中文意思", "q": "stage", "o": ["舞台", "樂團", "派對", "標誌"], "a": 0, "ex": ""}, {"id" function pick(units,n,wrongOnly){let pool=wrongOnly?S.wrongPool.map(id=>DATA.q.find(x=>x.id===id)).filter(Boolean):DATA.q.filter(x=>units.includes(x.u));
 const seen=store.get('seen',[]);const fresh=pool.filter(x=>!seen.includes(x.id)),old=pool.filter(x=>seen.includes(x.id));
 let chosen=shuffle(fresh).concat(shuffle(old)).slice(0,n);store.set('seen',[...new Set(seen.concat(chosen.map(x=>x.id)))].slice(-400));return shuffle(chosen)}
function startLevel(l){S.lv=l;S.qs=pick(l.units,l.n,l.id==='wrong');S.qi=0;S.max=Math.round(S.qs.length*6);S.hp=S.max;S.right=0;S.wrong=[];S.turn=0;S.start=Date.now();
 $('#mon').textContent=l.em;$('#lvName').textContent=l.name+'・'+l.mon;$('#modeTag').textContent=S.mode==='turn'?'輪流答題':'搶答';show('play');renderQ()}
function renderQ(){clearInterval(S.tid);const q=S.qs[S.qi];S.cur=q;S.answered=false;S.locked=new Set();
 const opts=shuffle(q.o.map((t,i)=>({t,ok:i===q.a})));S.opts=opts;
 $('#qNo').textContent=`第 ${S.qi+1} / ${S.qs.length} 題`;$('#qask').textContent=q.ask||'';$('#qtxt').innerHTML=q.q;$('#exp').classList.add('hide');
 const ob=$('#opts');ob.innerHTML='';opts.forEach((o,i)=>{const b=el('button','opt',`<i>${'ABCD'[i]}</i><span>${o.t}</span>`);b.onclick=()=>choose(i);ob.append(b)});
 S.cur_team=S.mode==='turn'?S.turn%S.teams.length:null;drawScore();setHP();
 $('#msg').textContent=S.mode==='turn'?`輪到 ${S.teams[S.cur_team].emo} ${S.teams[S.cur_team].name}，討論後老師點選答案`:'搶答！按隊伍鍵（1～'+S.teams.length+'）選出搶到的隊伍，再選答案';
 $('#nextBtn').textContent='公布答案 ⏎';
 if(S.autosay&&isEN(q.q.replace(/<[^>]+>/g,'')))setTimeout(()=>say(q.q),250);
 startTimer()}
function drawScore(){const b=$('#score');b.innerHTML='';S.teams.forEach((t,i)=>{const d=el('div','tm'+(S.cur_team===i?' cur':'')+(S.locked.has(i)?' lock':''),`<div class="n">${i+1}　${t.emo} ${esc(t.name)}</div><div class="s">${t.score}</div>`);d.onclick=()=>pickTeam(i);b.append(d)})}
function setHP(){$('#hp').style.width=Math.max(0,S.hp/S.max*100)+'%'}
function pickTeam(i){if(S.answered||S.locked.has(i))return;S.cur_team=i;drawScore();$('#msg').textContent=`${S.teams[i].emo} ${S.teams[i].name} 回答：點選答案（A～D）`}
function startTimer(){if(!S.timer){$('#tbar').classList.add('hide');return}$('#tbar').classList.remove('hide');S.t0=Date.now();$('#tfill').style.width='100%';
 S.tid=setInterval(()=>{const r=1-(Date.now()-S.t0)/1000/S.timer;$('#tfill').style.width=Math.max(0,r*100)+'%';if(r<=0.2&&r>0&&Math.floor(r*S.timer*2)%2===0)sfx.tick();if(r<=0){clearInterval(S.tid);if(!S.answered){sfx.bad();$('#msg').textContent='⏰ 時間到！';if(S.mode==='turn')reveal(false)}}},250)}
function choose(i){if(S.answered)return;const o=S.opts[i];
 if(S.cur_team==null){$('#msg').textContent='請先按隊伍鍵選出搶到的隊伍';return}
 const t=S.teams[S.cur_team],btn=$('#opts').children[i];
 if(o.ok){t.score+=10;S.right++;btn.classList.add('ok');sfx.ok();hit(true);reveal(true,true)}
 else{btn.classList.add('bad');sfx.bad();
  if(S.mode==='buzz'){S.locked.add(S.cur_team);btn.disabled=true;const left=S.teams.length-S.locked.size;S.cur_team=null;drawScore();
   if(left>0){$('#msg').textContent=`答錯了！其他隊可以偷答：按隊伍鍵；沒人要搶就按 Enter 公布答案`;return}}
  reveal(false)}}
function hit(good){const m=$('#mon');m.classList.remove('hit','heal');void m.offsetWidth;m.classList.add(good?'hit':'heal');if(good){sfx.hit();S.hp-=10}else S.hp+=4;S.hp=Math.min(S.max,S.hp);setHP()}
function reveal(good,already){clearInterval(S.tid);if(S.answered)return;S.answered=true;
 if(!good){hit(false);S.wrong.push(S.cur.id)}
 [...$('#opts').children].forEach((b,i)=>{b.disabled=true;if(S.opts[i].ok)b.classList.add('ok');else if(!b.classList.contains('bad'))b.classList.add('dim')});
 const e=$('#exp');e.innerHTML=(good?'🎉 答對了！':'✋ 正確答案：<b>'+S.opts.find(o=>o.ok).t+'</b>')+(S.cur.ex?'<br>'+S.cur.ex:'');e.classList.remove('hide');
 drawScore();$('#msg').textContent=good?`${S.teams[S.cur_team].emo} ${S.teams[S.cur_team].name} +10 分，怪獸受傷！`:'沒人答對，怪獸回血了…';
 S.turn++;$('#nextBtn').textContent=S.qi+1>=S.qs.length?'看結果 ⏎':'下一題 ⏎';
 if(S.autosay){const t=S.cur.q.replace(/___+/,S.opts.find(o=>o.ok).t);if(isEN(t.replace(/<[^>]+>/g,''))&&!isEN(S.cur.q.replace(/<[^>]+>/g,'')))setTimeout(()=>say(S.opts.find(o=>o.ok).t),400)}}
function next(){if(!S.answered){if(S.cur_team==null&&S.mode==='buzz'&&S.locked.size===0&&false)return;reveal(false);return}
 if(S.qi+1>=S.qs.length)return finish();S.qi++;renderQ()}
$('#nextBtn').onclick=next;$('#skipBtn').onclick=()=>{if(S.answered)return next();S.answered=true;clearInterval(S.tid);S.turn++;S.qi+1>=S.qs.length?finish():(S.qi++,renderQ())};
$('#mapBtn').onclick=()=>{clearInterval(S.tid);drawMap();show('map')};
$('#sayBtn').onclick=()=>say(S.cur?S.cur.q:'');
/* ---------- 抽人 ---------- */
function rnd(){const ov=$('#rndOv');ov.classList.remove('hide');let k=0;const id=setInterval(()=>{$('#rndNum').textContent=1+Math.floor(Math.random()*S.seat);sfx.tick();if(++k>14)clearInterval(id)},70)}
$('#rndBtn').onclick=rnd;$('#rndClose').onclick=()=>$('#rndOv').classList.add('hide');
/* ---------- 結算 ---------- */
function finish(){clearInterval(S.tid);const win=S.hp<=0,acc=Math.round(S.right/S.qs.length*100);const st=win?(acc>=90?3:acc>=80?2:1):0;
 if(win&&st>stars(S.lv.id))store.set('star_'+S.lv.id,st);
 S.wrongPool=[...new Set(S.wrongPool.filter(id=>!S.qs.some(q=>q.id===id)||S.wrong.includes(id)).concat(S.wrong))].slice(-40);store.set('wrongpool',S.wrongPool);
 const rank=S.teams.map((t,i)=>({t,i})).sort((a,b)=>b.t.score-a.t.score);
 const r=$('#result');r.innerHTML='';const c=el('div','card');
 c.innerHTML=`<h1 style="color:var(--ink);text-align:center">${win?'🎉 打倒 '+S.lv.mon+'！':'😱 '+S.lv.mon+' 逃走了…'}</h1><p style="text-align:center;font-size:1.4rem">${win?'⭐'.repeat(st):'再挑戰一次吧'}　全班答對 ${S.right} / ${S.qs.length}（${acc}%）</p>
 <table>${rank.map((x,k)=>`<tr><td>${['🥇','🥈','🥉'][k]||k+1}</td><td>${x.t.emo} ${esc(x.t.name)}</td><td style="text-align:right;font-weight:800">${x.t.score} 分</td></tr>`).join('')}</table>
 ${S.wrong.length?`<h3>📌 這關答錯的題目（${S.wrong.length}）</h3><table>${S.wrong.map(id=>{const q=DATA.q.find(x=>x.id===id);return `<tr><td>${q.q}</td><td><b>${q.o[q.a]}</b></td></tr>`}).join('')}</table>`:'<p style="text-align:center">全部答對，太強了！</p>'}
 <div class="ctl" style="justify-content:center"><button class="big" id="again">${win?'再玩一次':'再挑戰'}</button><button id="toMap">🗺 回地圖</button></div>`;
 r.append(c);show('result');$('#again').onclick=()=>startLevel(S.lv);$('#toMap').onclick=()=>{drawMap();show('map')};
 if(win){sfx.win();confetti()}else sfx.bad()}
function confetti(){const cv=$('#fx'),x=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;const p=Array.from({length:160},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,v:2+Math.random()*4,r:4+Math.random()*6,c:`hsl(${Math.random()*360},90%,60%)`,w:Math.random()*6}));let f=0;(function a(){x.clearRect(0,0,cv.width,cv.height);p.forEach(q=>{q.y+=q.v;q.x+=Math.sin((q.y+q.w)/20)*2;x.fillStyle=q.c;x.fillRect(q.x,q.y,q.r,q.r*1.6)});if(++f<260)requestAnimationFrame(a);else x.clearRect(0,0,cv.width,cv.height)})()}
/* ---------- 鍵盤 ---------- */
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;const k=e.key.toLowerCase();
 if(!$('#rndOv').classList.contains('hide')){if(k==='enter'||k===' '||k==='escape')$('#rndClose').click();return}
 if($('#play').classList.contains('hide')){if(k==='r')rnd();return}
 if(/^[1-6]$/.test(k)&&+k<=S.teams.length)pickTeam(+k-1);
 else if('abcd'.includes(k)&&k.length===1&&'abcd'.indexOf(k)<S.opts.length)choose('abcd'.indexOf(k));
 else if(k==='enter'||k===' '){e.preventDefault();next()}
 else if(k==='s')$('#skipBtn').click();else if(k==='r')rnd();else if(k==='p')$('#sayBtn').click();else if(k==='m')$('#mapBtn').click()});
if(location.protocol.startsWith('http')&&'serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
